services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/data
      - ./experiments:/app/experiments
      # Override the installed `scripts` package with the live source tree so
      # CLI tweaks pick up on container restart instead of needing an image rebuild.
      - ./backend/scripts:/usr/local/lib/python3.12/site-packages/scripts
      # Same trick for the FastAPI source — uvicorn imports `src.main` from
      # /app first, so this overrides the build-time copy.
      - ./backend/src:/app/src
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    profiles:
      - full  # Only started with `docker compose --profile full up`

  # Optional: local LLM serving
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - local-llm  # Only started with `docker compose --profile local-llm up`

volumes:
  qdrant_data:
  ollama_data:
