# Corpus manifest for the RAG vs LLM Wiki experiment.
#
# 24 papers across 3 domains (8 each). Roles drive ingestion order so the
# RAG side mirrors how the Wiki was built:
#   Anchor    -> ingested first; establishes schema/foundational definitions
#   Chrono    -> historical / evolving knowledge
#   Bridge    -> cross-domain or technical/legal connectors
#   Conflict  -> contradictions; ingested last to stress the contextual store
#
# The PDFs themselves are NOT committed. Drop them into
# experiments/papers/<domain>/ matching the `file:` path here. The ingest
# CLI prints which ones are missing so you can correct paths if needed.

ingest_order: [Anchor, Chrono, Bridge, Conflict]

collections:
  - name: ai-ethics-law
    description: |
      AI Ethics & Law domain — copyright/fair-use disputes around generative
      AI, with technical detection methods (membership inference attacks)
      bridging the legal and engineering literatures.
    documents:
      - file: papers/ai-ethics-law/ethics-anchor-generative-ai-stober.pdf
        tags:
          domain: ai-ethics-law
          role: Anchor
          year: 2026
          authors: Stober & Dornis
          title: Generative AI Training and Copyright Law
      - file: papers/ai-ethics-law/ethics-anchor-creative-ownership-liang.pdf
        tags:
          domain: ai-ethics-law
          role: Anchor
          year: 2026
          authors: Liang & Lut
          title: Creative Ownership in the Age of AI
      - file: papers/ai-ethics-law/ethics-bridge-g-drift-ranjan.pdf
        tags:
          domain: ai-ethics-law
          role: Technical Bridge
          year: 2026
          authors: Ranjan et al.
          title: G-Drift MIA — Membership Inference via Gradient-Induced Feature Drift in LLMs
      - file: papers/ai-ethics-law/ethics-bridge-membership-inference-liu.pdf
        tags:
          domain: ai-ethics-law
          role: Technical Bridge
          year: 2026
          authors: Liu et al.
